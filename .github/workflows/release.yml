name: Build and publish multi-platform release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, e.g. v1.0.1 (must not exist already)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: vpngate-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            executable: vpngate-tui.exe
            asset: vpngate-tui-windows-x64.zip
          - runner: ubuntu-24.04
            executable: vpngate-tui
            asset: vpngate-tui-linux-x64.tar.gz
          - runner: ubuntu-24.04-arm
            executable: vpngate-tui
            asset: vpngate-tui-linux-arm64.tar.gz
          - runner: macos-15-intel
            executable: vpngate-tui
            asset: vpngate-tui-macos-intel.tar.gz
          - runner: macos-15
            executable: vpngate-tui
            asset: vpngate-tui-macos-arm64.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0,<7.0"
      - name: Check script syntax
        run: python -m py_compile vpngate_tui.py
      - name: Build standalone console executable
        run: python -m PyInstaller --onefile --console --noconfirm --clean --name vpngate-tui --collect-all textual --collect-all rich vpngate_tui.py
      - name: Smoke-test executable
        shell: bash
        run: ./dist/${{ matrix.executable }} --help
      - name: Package release binary
        run: python scripts/package_release.py dist/${{ matrix.executable }} release/${{ matrix.asset }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify release files and write SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 5
          cd release
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v1.0.0' }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version tag: $RELEASE_TAG"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "VPN Gate TUI $RELEASE_TAG" --notes-file RELEASE_NOTES.md
